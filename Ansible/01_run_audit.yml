---
- name: 1. 타깃 서버 KISA 보안 진단 수행 및 결과 회수
  hosts: targets
  become: true
  gather_facts: true
  vars:
    audit_mode: "check"
    remote_dir: "/tmp/kisa_audit"
    remote_result: "/tmp/kisa_audit/result.json"
    local_report_dir: "{{ playbook_dir }}/audit_reports/raw_json"

  tasks:
    - name: 이전 raw_json 초기화
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: absent
      delegate_to: localhost
      run_once: true

    - name: raw_json 디렉토리 재생성
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: 대상 서버 임시 디렉토리 배포
      ansible.builtin.copy:
        src: scripts/
        dest: "{{ remote_dir }}/"
        mode: "0755"

    - name: 진단 스크립트 실행
      ansible.builtin.command:
        cmd: "bash main_runner.sh {{ audit_mode }} {{ remote_result }}"
        chdir: "{{ remote_dir }}"

    - name: 진단 결과 회수
      ansible.builtin.fetch:
        src: "{{ remote_result }}"
        dest: "{{ local_report_dir }}/{{ inventory_hostname }}.json"
        flat: true

    - name: 대상 서버 임시 파일 제거
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: absent


- name: 2. Control Node 결과 병합 및 MySQL DB 자동 적재
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_db: "audit_autoever_2026"
    final_json: "{{ playbook_dir }}/audit_reports/final_report.json"

  tasks:
    - name: 02_generate_report.py 실행 (리포트 통합 및 배점 계산)
      ansible.builtin.command:
        cmd: "python3 02_generate_report.py --raw-dir audit_reports/raw_json --out {{ final_json }}"
      args:
        chdir: "{{ playbook_dir }}"

    - name: 03_save_to_mysql.py 실행 (DB 자동 INSERT)
      ansible.builtin.command:
        cmd: "python3 03_save_to_mysql.py {{ target_db }} {{ final_json }}"
      args:
        chdir: "{{ playbook_dir }}"
      register: db_output

    - name: 적재 완료 메시지 출력
      ansible.builtin.debug:
        msg: "{{ db_output.stdout_lines }}"