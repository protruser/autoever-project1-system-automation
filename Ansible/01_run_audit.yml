---
# 01_run_audit.yml - KISA U-01~U-67 원스톱 진단, JSON 회수, 병합 및 DB 자동 적재 Playbook
# 사용법:
#   ansible-playbook -i hosts.ini 01_run_audit.yml                  # 전체 서버 진단
#   ansible-playbook -i hosts.ini 01_run_audit.yml -l rocky1        # 특정 서버만 진단
#   ansible-playbook -i hosts.ini 01_run_audit.yml -e audit_mode=fix # 조치 후 재진단

- name: 1. 타깃 서버 KISA 보안 진단 수행 및 결과 회수
  hosts: targets
  become: true                         # 타깃 서버 점검은 루트(root) 권한 필수
  gather_facts: true
  ignore_unreachable: true             # 오프라인 서버가 있어도 중단 없이 진행
  vars:
    audit_mode: "check"                # check | fix
    remote_dir: "/tmp/kisa_audit"
    remote_result: "/tmp/kisa_audit/result.json"
    local_report_dir: "{{ playbook_dir }}/audit_reports/raw_json"

  tasks:
    - name: 로컬 raw_json 디렉토리 생성 (Control Node)
      ansible.builtin.file:
        path: "{{ local_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true
      become: false                    # Control Node 로컬 작업은 일반 권한 실행

    - name: 대상 서버 이전 잔여물 제거
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: absent

    - name: 진단/조치 스크립트 배포
      ansible.builtin.copy:
        src: scripts/
        dest: "{{ remote_dir }}/"
        mode: "0755"

    - name: 진단 스크립트 실행 (Root 권한)
      ansible.builtin.command:
        cmd: "bash main_runner.sh {{ audit_mode }} {{ remote_result }}"
        chdir: "{{ remote_dir }}"
      register: audit_run
      changed_when: audit_mode == "fix"

    - name: 진단 결과(JSON) 회수
      ansible.builtin.fetch:
        src: "{{ remote_result }}"
        dest: "{{ local_report_dir }}/{{ inventory_hostname }}.json"
        flat: true

    - name: 대상 서버 임시 파일 정리
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: absent


- name: 2. 리포트 병합 및 MySQL DB 적재 (Control Node)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false                        # Control Node 로컬 스크립트 실행은 일반 권한 유지
  vars:
    target_db: "audit_autoever_2026"
    final_json: "{{ playbook_dir }}/audit_reports/final_report.json"

  tasks:
    - name: 02_generate_report.py 실행 (단일 JSON 통합 및 점수 산출)
      ansible.builtin.command:
        cmd: "python3 02_generate_report.py --raw-dir audit_reports/raw_json --out {{ final_json }}"
      args:
        chdir: "{{ playbook_dir }}"

    - name: 03_save_to_mysql.py 실행 (MySQL DB 자동 INSERT)
      ansible.builtin.command:
        cmd: "python3 03_save_to_mysql.py {{ target_db }} {{ final_json }}"
      args:
        chdir: "{{ playbook_dir }}"
      register: db_output

    - name: DB 적재 결과 출력
      ansible.builtin.debug:
        msg: "{{ db_output.stdout_lines }}"