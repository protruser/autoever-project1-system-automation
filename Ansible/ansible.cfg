[defaults]
inventory = hosts.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# 모듈을 SFTP로 임시 파일에 올렸다 실행 후 지우는 대신 stdin으로 바로 흘려보낸다.
# Tailscale relay처럼 왕복 지연이 큰 구간에서 task당 SSH 왕복 횟수를 줄여준다.
# (sudoers에 requiretty가 설정되어 있으면 pipelining과 충돌하니 주의)
pipelining = True
